name: Miner beta request
description: Request an operator-assisted Intel TDX live-testing slot
title: "[Miner beta] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form to request a beta slot. This issue is public.

        Cathedral's provider path is operator-assisted live testing. A slot,
        positive weight, and emissions are not guaranteed. Apply before paying
        for new infrastructure or subnet registration.

        **Never include a wallet seed, private key, bearer token, TLS private
        key, cloud credential, IP address, instance identifier, or SSH
        credential.** A maintainer will arrange any private exchange only after
        reviewing the request.

  - type: input
    id: hotkey
    attributes:
      label: Hotkey address
      description: Public SS58 hotkey address you control. It need not be registered before the request is accepted.
      placeholder: 5...
    validations:
      required: true

  - type: dropdown
    id: network
    attributes:
      label: Network
      description: SN39 is mainnet live testing; SN292 is non-paying integration. Selection is subject to maintainer acceptance.
      options:
        - Mainnet SN39 live testing
        - Testnet SN292
    validations:
      required: true

  - type: dropdown
    id: hardware
    attributes:
      label: Hardware
      description: The current provider path accepts Intel TDX CPU only.
      options:
        - Intel TDX confidential VM
        - I do not have Intel TDX yet
    validations:
      required: true

  - type: input
    id: provider_region
    attributes:
      label: Provider and region
      description: Do not include account, project, instance, or credential identifiers.
      placeholder: Cloud provider, country or region
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: Preferred private contact
      description: Optional public handle a maintainer can use. Remember that this issue is public.
      placeholder: Discord, Telegram, or another non-secret handle

  - type: checkboxes
    id: checks
    attributes:
      label: Readiness
      options:
        - label: I control the public hotkey listed above and will register it only after the beta slot and network are confirmed.
          required: true
        - label: "If I already have a machine, Cathedral census reports `Intel TDX : yes` and the configfs-tsm report root exists."
          required: false
        - label: I understand registration and attestation do not earn by themselves, positive weight is not guaranteed, and SN292 never pays emissions.
          required: true
        - label: I understand that mainnet workers require the accepted HTTPS and channel-binding setup; plain HTTP development mode is not a production path.
          required: true
        - label: I have not included any secret in this public issue.
          required: true
