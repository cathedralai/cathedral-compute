name: Publisher drift

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  detect:
    name: Public evidence vs checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Fetch origin/main
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Detect publisher drift
        run: |
          python scripts/detect_publisher_drift.py \
            --evidence-url https://api.cathedral.computer/v1/evidence \
            --network finney \
            --netuid 39 \
            --git-dir . \
            --git-ref origin/main \
            --max-age-minutes 180 \
            --require-release --release pins/publisher-release.json \
            --require-signed-index --index-keys pins/evidence-index-keys.json
