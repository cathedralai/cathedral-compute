[project]
name = "cathedral"
version = "0.0.0"
description = "Confidential compute subnet (SN39): attestation is admission, verified work is currency"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  # Public policy registries use audited Ed25519 primitives rather than a
  # project-local signature implementation.
  "cryptography>=42.0",
]

[project.optional-dependencies]
# The public enrollment service verifies sr25519 signatures but never opens a
# wallet. The miner-side submit command opens a local Bittensor wallet. Keep
# the roles explicit so immutable production environments install only the
# key implementation they execute.
enrollment-service = ["substrate-interface>=1.7.0,<2"]
enrollment-miner = ["bittensor-wallet>=4.0.1,<5"]
# Install this role in its own producer environment. Bittensor 10 uses cyscale,
# while substrate-interface uses py-scale-codec under the same module name.
enrollment-operator = ["bittensor>=10.3.1,<11"]
# Additional validator-chain and test tooling. The producer role stays out of
# this environment to avoid combining those incompatible codec stacks.
dev = [
  "pytest>=8.0",
  "substrate-interface>=1.7.0,<2",
  "bittensor-wallet>=4.0.1,<5",
]

[project.scripts]
cathedral = "cathedral.cli:main"
cathedral-census = "cathedral.census:main"
cathedral-prober = "cathedral.prober:main"
# Operator aliases for the worker and score-publication runtime. Keep the
# subnet validator's public command name reserved for cathedral-scaffold.
cathedral-compute-validator = "cathedral.neuron.validator:main"
cathedral-miner = "cathedral.neuron.miner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
